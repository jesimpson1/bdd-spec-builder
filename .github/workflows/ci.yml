name: Validate skill and example

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/shop/package-lock.json
      - name: Install validation dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install PyYAML==6.0.3
      - name: Validate skill metadata and local documentation links
        run: .venv/bin/python .github/scripts/validate_skill.py
      - name: Install standalone example dependencies
        working-directory: examples/shop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Cucumber.js example
        working-directory: examples/shop
        run: npm test
